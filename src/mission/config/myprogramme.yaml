# ---------------------------- 任务开关 ----------------------------
# 0 = 遥控器切 OFFBOARD（程序只等待）  1 = 程序自己切（仿真必须用 1）
if_debug: 1
# 到达判定阈值，m（mission_pos_cruise 的 error_max）
err_max: 0.2

# ---------------------------- 轨迹几何 ----------------------------
altitude: 1.2             # 爱心飞行高度，m（相对起飞点）
width: 1.6                # 爱心宽度，m（周长 ≈ 3.2 × 宽度；1.6 → 约 5.1 m）
offset_x: 0.0             # 爱心中心相对起飞点的 x 偏移，m
offset_y: 0.0             # 爱心中心相对起飞点的 y 偏移，m

# ---------------------------- 速度与节奏 --------------------------
speed: 0.30               # 轨迹线速度，m/s（0.2 ~ 0.5 比较稳）
hold_time: 3.0            # 画完悬停时间，s（到时间后再等速度收敛才降落）
ctrl_hz: 20.0             # 控制频率，Hz（PX4 要求 > 2，20 ~ 50 合适）
